name: Monitorar Preco Centauro

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar Tor
        run: |
          sudo apt-get update -q
          sudo apt-get install -y tor
          sudo service tor start
          # Aguarda o Tor estabelecer circuito (~15s)
          sleep 20
          echo "Tor iniciado."

      - name: Instalar dependencias Python
        run: pip install requests requests[socks]

      - name: Rodar monitor
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python monitor.py
