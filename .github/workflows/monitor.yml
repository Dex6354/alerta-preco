name: DEBUG Monitor Centauro

on:
  workflow_dispatch:   # só roda manualmente

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar Tor
        run: |
          sudo apt-get update -q
          sudo apt-get install -y tor
          sudo service tor start
          sleep 20
          echo "Tor iniciado."

      - name: Instalar dependencias
        run: pip install requests requests[socks]

      - name: Rodar DEBUG
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python monitor_debug.py

      - name: Upload HTML capturado
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: centauro-html-debug
          path: /tmp/centauro_debug.html
          retention-days: 1
